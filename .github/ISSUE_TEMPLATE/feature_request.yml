name: Feature request
description: Suggest an idea for SoloHQ
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the feature do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why is this useful?
      description: Describe the problem or workflow it improves.
